services:
  - type: web
    name: flowsy-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: corepack enable && corepack prepare pnpm@10.34.5 --activate && pnpm install --frozen-lockfile --prod=false && pnpm prisma:generate && pnpm build
    startCommand: pnpm prisma:migrate:deploy && pnpm start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flowsy-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: CORS_ORIGIN
        value: https://flowsy-api.onrender.com
      - key: DEFAULT_CURRENCY
        value: EGP
      - key: DEFAULT_TIMEZONE
        value: Africa/Cairo

databases:
  - name: flowsy-db
    databaseName: flowsy
    user: flowsy
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "17"
